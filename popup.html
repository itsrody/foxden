<!DOCTYPE html>
<html>
	<head>
		<title>JSLibCache</title>
		<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
		<meta charset="utf-8"/>
		<link rel="stylesheet" type="text/css" href="popup.css"/>
		<script src="popup.js" defer></script>
	</head>
	<body>
		<main>
			<h1>JSLibCache: JavaScript Library Cache</h1>
			<div>
				<div>
					<input type="radio" name="tab" value="stats" id="tabstats" checked/><label for="tabstats">Statistics</label>
					<div>
						<table>
							<colgroup>
								<col class="name"/>
								<col class="version"/>
								<col class="stat"/>
								<col class="stat"/>
								<col class="stat"/>
							</colgroup>
							<thead>
								<tr><td>Library Name</td><th>Version</th><th title="Overall
(Not yet implemented)">All</th><th title="This browsing session">Ses</th><th title="This tab">Tab</th></tr>
							</thead>
							<tbody>
							</tbody>
						</table>
					</div>
				</div>
				<div>
					<input type="radio" name="tab" value="setti" id="tabsetti"/><label for="tabsetti">Settings</label>
					<div class="form">
						<div><span>Clear cache</span><button type="button" id="clearcache" title="Clear all of the locally cached Javascript libraries, CSS and Fonts and reset Statistics">Clear Cache</button></div>
					</div>
				</div>
				<div>
					<input type="radio" name="tab" value="ubloc" id="tabubloc"/><label for="tabubloc">uBlock rules</label>
					<div>
						uBlock Origin "My rules" <small>(<a href="https://github.com/gorhill/uBlock/wiki/Dashboard:-My-rules">See uBlock₀ Wiki</a>)</small>
						<pre id="ublock"></pre>
					</div>
				</div>
				<div>
					<input type="radio" name="tab" value="creds" id="tabcreds"/><label for="tabcreds">Credits</label>
					<div>
						Version <b id="version">0.0.0</b><br/>
						Icons made by <a href="http://www.freepik.com/" title="Freepik">Freepik</a> from <a href="https://www.flaticon.com/" title="Flaticon">www.flaticon.com</a>
					</div>
				</div>
			</div>
		</main>
	</body>
</html>
