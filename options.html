<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<script src="jQueryLight.js" defer></script>
<script src="utils.js" defer></script>
<script src="options.js" defer></script>
<style>
:root {
	--in-content-page-color: #0C0C0D;
	--in-content-page-background: #F9F9FA;
	--in-content-text-color: #0C0C0D;
	--in-content-deemphasized-text: #4A4A4F;
	--in-content-box-border-color: rgba(12,12,13,0.3);
	--in-content-box-background: #FFF;
	--in-content-border-focus: #0A84FF;
}
@media (prefers-color-scheme: dark) { :root {
	--in-content-page-background: #2A2A2E;
	--in-content-page-color: #F9F9FA;
	--in-content-text-color: #F9F9FA;
	--in-content-deemphasized-text: #B1B1B3;
	--in-content-box-border-color: rgba(249,249,250,0.2);
	--in-content-box-background: #202023;
} }

html,body { font-size: 15px; font-weight: normal; margin: 0; font: message-box; background-color: var(--in-content-page-background); color: var(--in-content-page-color); }
body { font-size: 1.36em; }
main { padding: 28px; }
h1 { margin: 0 0 8px; font-size: 1.46em; font-weight: 300; line-height: 1.3em; color: var(--in-content-text-color); }
h2 { margin: 16px 0 4px; font-size: 1.14em; line-height: normal; font-weight: 600; }
small { font-size: 0.9em; color: var(--in-content-deemphasized-text); }
label { line-height: 1.8em; display: inline-block; margin: 2px 0; }
input[type="checkbox"]
{
	-moz-appearance: none;
	width: 20px;
	height: 20px;
	padding: 1px;
	border: 1px solid var(--in-content-box-border-color);
	border-radius: 2px;
	margin: 0;
	margin-inline-end: 10px;
	background-color: var(--in-content-box-background);
	background-position: center;
	background-repeat: no-repeat;
	vertical-align: text-bottom;
}
label:hover>input[type="checkbox"] { border-color: var(--in-content-border-focus); }
input[type="checkbox"]:checked { background-image: url("chrome://global/skin/icons/check.svg"); -moz-context-properties: fill; fill: #2292d0; }
</style>
</head>
<body>
<main>
<h1>Preferences</h1>
<form>
<h2>Global Settings</h2>
<label><input type="checkbox" id="replacegooglefonts" checked>Replace Google Fonts <small>CSS only for now, see <a href="https://bugzilla.mozilla.org/show_bug.cgi?id=1645683">Bugzilla</a></small></label><br/>

<h2>uBlock Origin Rules</h2>
<pre>
* ajax.googleapis.com * noop
* fonts.googleapis.com * noop
* ajax.googleapis.com * noop
* cdnjs.cloudflare.com * noop
* code.jquery.com * noop
* ajax.proxy.ustclug.org * noop
* sdn.geekzu.org * noop
</pre>
</form>
</main>
</body>
</html>
